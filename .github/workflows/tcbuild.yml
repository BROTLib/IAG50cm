name: TcBuild

# Compiles IAG50cm.sln and runs the IAG50cmTests TcUnit suites (offline tests of the stop logic, #120) on the
# shared self-hosted runner: builds the test project (it holds git-ignored copies of the tested function blocks
# from IAG50cm/POUs, made by Sync-Sources.ps1; the telescope rig compiles against the pinned BROTLib, installed by the step below) and runs it
# on the user-mode runtime (see IAG50cmTests/README.md). One job, so one runner slot per push.
#
# runs-on is a self-hosted runner and most of these repos are public. Therefore: `push` only, NEVER
# `pull_request` / `pull_request_target` -- a PR from any fork would otherwise execute on the runner
# (BROTLib#31; an earlier push+PR auto-trigger did exactly that and was reverted, see BROTLib
# specs/design/twincat-ci-runner-setup.md). A push can only come from someone with write access.
# Tags are ignored (the release flow tags after a build).
#
# The job is called `build` and covers the tests too, so a failing test blocks the required `build` check on
# main. A missing/expired trial license or a stopped user-mode runtime does NOT: the tests are skipped with a
# warning, so releases are not blocked whenever that hand-renewed infrastructure is down (IAG
# tools/github-rulesets.sh). Every repo of the org builds on every push, so the check name `build` exists everywhere. release.yml
# dispatches this workflow for the version bump (a push made with GITHUB_TOKEN starts no workflow).
#
# Not cancelled when a newer push arrives: a test run is deploying to the runtime and talking to a hidden XAE
# instance, and killing that mid-run leaves a stray TcXaeShell behind. Runs queue instead (GitHub keeps only
# the newest pending one).

# Skipped when the pushed tree is one that already passed (typically the merge of a tested branch): see the
# `Skip if this tree was already built and tested` step. A workflow_dispatch run always builds.
on:
  push:
    branches: ['**']
    tags-ignore: ['**']
  workflow_dispatch:

concurrency:
  group: twincat-tests
  cancel-in-progress: false

jobs:
  build:
    runs-on: [self-hosted, twincat, windows]
    # A healthy run takes a few minutes. Without a limit a hung TcXaeShell blocks the single runner (and the
    # CI of every repo) for the default 6 hours. On a timeout the job is cancelled and the `always()` cleanup
    # step below still runs.
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read     # tools/Find-TestedTree.ps1 lists earlier runs; a private repo (this one) needs it
      statuses: write   # the commit status below
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # A merge brings a new commit but often the tree that already passed on the branch. Then the build (and
      # tests) below are skipped; the job still ends green, so the required `build` check is satisfied.
      # See tools/Find-TestedTree.ps1 (best effort: on any doubt it answers "full build").
      - name: Skip if this tree was already built and tested
        id: same
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: .\tools\Find-TestedTree.ps1

      # TcBuild starts TcXaeShell through COM (parent svchost, in the session of the runner service). A hung or
      # cancelled build leaves it behind and it can break the next build. Stop what runs in this job's own
      # session: a TcXaeShell someone opened interactively runs in another session and is left alone.
      - name: Stop leftover TwinCAT build processes
        if: always()
        shell: powershell
        run: |
          $session = (Get-Process -Id $PID).SessionId
          Get-Process -Name TcXaeShell, TcBuild -ErrorAction SilentlyContinue |
            Where-Object { $_.SessionId -eq $session } |
            ForEach-Object { Write-Host "stopping $($_.ProcessName) $($_.Id)"; Stop-Process -Id $_.Id -Force }

      # The PLC needs a license. The 7-day trial is renewed by hand. Once it has run out, or when a license the
      # tests need is not in it, the tests cannot run: warn with a clear message and skip them (output ok=false)
      # instead of failing the build, which would block releases (the compile steps do not need it).
      - name: Get tctool
        shell: powershell
        env:
          GH_TOKEN: ${{ secrets.TCTOOL_TOKEN }}
        run: .\tools\Get-TcTool.ps1

      # The org libraries this repo pins in its .plcproj files are reinstalled from their GitHub release before the
      # build. A `*` reference picks the highest version in the shared library repository, and a branch build of
      # that library overwrites its version slot, so the result depended on what ran last.
      - name: Install pinned libraries
        if: steps.same.outputs.same != 'true'
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: .\tools\Install-PinnedLibraries.ps1

      - name: Build IAG50cm.sln
        if: steps.same.outputs.same != 'true'
        shell: powershell
        run: |
          tctool IAG50cm.sln build
          if ($LASTEXITCODE -gt 1) { exit $LASTEXITCODE }
          exit 0

      # XAE cannot link files from outside the project folder, so the test project holds (git-ignored) copies of
      # the tested function blocks; copy them from IAG50cm/POUs, the code that is activated on the telescope.
      - name: Copy tested function blocks
        if: steps.same.outputs.same != 'true'
        shell: powershell
        run: .\IAG50cmTests\tools\Sync-Sources.ps1

      # One tctool call: build the tests (exit 1 = compile warnings: the copied FB_TelescopeControl has empty
      # interface members, a success), then deploy them to the user-mode runtime and wait for TcUnit, in one XAE
      # session. `run` checks the license and the runtime first and returns 13 if the tests cannot run: the build
      # is checked either way, the job stays green with a warning (--skip-if-unavailable), and `ran` stays false so
      # no `tests-passed` status is posted. Exit 2 = compile errors, 10 = a test failed or none ran, 11 = timeout,
      # 14 = TwinCAT stayed in Config after the restart (license).
      - name: Build and run IAG50cmTests
        id: tests
        if: steps.same.outputs.same != 'true'
        shell: powershell
        working-directory: IAG50cmTests
        run: |
          tctool IAG50cmTests.sln build run --require-license TC1200 --skip-if-unavailable
          $code = $LASTEXITCODE
          # (not `>>`: Windows PowerShell 5.1 would write UTF-16, which the runner cannot parse)
          if ($code -le 1) { [IO.File]::AppendAllText($env:GITHUB_OUTPUT, "ran=true`n"); exit 0 }
          if ($code -eq 13) { [IO.File]::AppendAllText($env:GITHUB_OUTPUT, "ran=false`n"); exit 0 }
          exit $code

      # Proof for tools/Find-TestedTree.ps1 that the tests really ran on this commit (a run that skipped them
      # because the license or runtime was missing is green too and must not vouch for a later commit).
      - name: Mark the commit as tested (status `tests-passed`)
        if: steps.tests.outputs.ran == 'true'
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh api "repos/${{ github.repository }}/statuses/${{ github.sha }}" `
            -f state=success -f context=tests-passed -f description="tests passed" -f target_url="$env:RUN_URL"
          if ($LASTEXITCODE -ne 0) { Write-Host "::warning::posting the tests-passed status failed with exit code $LASTEXITCODE" }

      # A workflow_dispatch run (release.yml dispatches one for the version bump) is not linked to the
      # release PR, so its `build` check run does not satisfy the required `build` check on main and the PR
      # stays blocked (IAG #6). A commit status is tied to the SHA only: report this job's result as one.
      - name: Report the result as commit status `build`
        if: always() && github.event_name == 'workflow_dispatch'
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
          STATE: ${{ job.status == 'success' && 'success' || 'failure' }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh api "repos/${{ github.repository }}/statuses/${{ github.sha }}" `
            -f state="$env:STATE" -f context=build -f description="TcBuild (dispatched run)" -f target_url="$env:RUN_URL"
          if ($LASTEXITCODE -ne 0) { throw "posting the commit status failed with exit code $LASTEXITCODE" }

      # Same cleanup after the build, so a hung or timed-out build does not leave TcXaeShell behind.
      - name: Stop leftover TwinCAT build processes (after the build)
        if: always()
        shell: powershell
        run: |
          $session = (Get-Process -Id $PID).SessionId
          Get-Process -Name TcXaeShell, TcBuild -ErrorAction SilentlyContinue |
            Where-Object { $_.SessionId -eq $session } |
            ForEach-Object { Write-Host "stopping $($_.ProcessName) $($_.Id)"; Stop-Process -Id $_.Id -Force }
